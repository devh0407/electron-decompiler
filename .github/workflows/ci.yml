name: ci

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analyzer and path tests
        run: npm test
      - name: Syntax check
        run: npm run check
